[mod]
id          = "yog-pipes"
name        = "@Strings.mod_name"
version     = "0.9.1"
description = "@Strings.mod_description"
authors     = ["Yog Team"]
license     = "AGPL-3.0-only"
edition     = "2024"

[dependencies]
yog-api = "0.100.0"
# The game-independent engine (core/); the path is relative to the
# generated .yog-build/.
yog-pipes-core = { path = "../core" }

[run."fabric-1.21.1"]
name       = "Fabric 1.21.1"
export_dir = "../Yog-Mod-Loader/fabric/run/yog-mods"
command    = "./gradlew"
args       = ["runClient", "-Pminecraft_version=1.21.1"]
cwd        = "../Yog-Mod-Loader/fabric"
env        = [
    "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64",
    "__NV_PRIME_RENDER_OFFLOAD=1",
    "__GLX_VENDOR_LIBRARY_NAME=nvidia",
    "__VK_LAYER_NV_optimus=NVIDIA_only",
]

